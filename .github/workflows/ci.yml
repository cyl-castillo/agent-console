name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm test

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './src-tauri -> target'

      # tauri-build validates externalBin paths at compile time, so the
      # sidecar must exist before any cargo check/clippy/test of the app.
      - name: Build hook-bridge sidecar
        working-directory: src-tauri
        run: |
          cargo build -p hook-bridge --release
          mkdir -p binaries
          cp target/release/hook-bridge binaries/hook-bridge-x86_64-unknown-linux-gnu

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Known-vulnerability scan of the dependency tree (RustSec advisory DB).
      # Warnings (unmaintained/yanked) don't fail the build; actual
      # vulnerabilities do.
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit

  # Contributions must certify the DCO (see CONTRIBUTING.md). Push builds on
  # main skip this — the trailer is enforced at the door, not retroactively.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (git commit -s)"
              bad=1
            fi
          done
          exit "$bad"
