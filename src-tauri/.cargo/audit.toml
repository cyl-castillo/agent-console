# cargo-audit policy. Ignores are DOCUMENTED EXCEPTIONS, not dismissals:
# every entry needs the reason and the unblock condition.
[advisories]
ignore = [
    # quick-xml <0.41 DoS-class issues (quadratic dup-attribute check /
    # unbounded namespace allocation). Pinned by plist -> tauri-utils; no
    # compatible fix until Tauri bumps plist. plist parsing happens in the
    # bundling toolchain, not on hostile input at runtime. Re-check on every
    # Tauri upgrade and drop these when `cargo update quick-xml` moves.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zip <9 `extract()` issues (SUID/SGID bits kept, permissions applied
    # through symlinks, symlink targets outside the destination, and
    # 2026-0429: a symlink entry with a huge declared size aborts the
    # process). Our own `zip` is on 9 and unpacks entry by entry behind
    # `enclosed_name`. What remains: zip 8 pinned by candle-core 0.11 (loads
    # safetensors, never extracts an archive) and zip 4 pinned by
    # tauri-plugin-updater 2.10 (extracts only the update it downloaded,
    # after verifying our minisign signature — an archive we signed). Drop
    # these when candle and the updater move to zip >= 9 (checked 2026-11-04:
    # candle-core 0.11 and updater 2.10.1 are the latest releases; Carlos OK'd
    # the exception the same day).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
]
