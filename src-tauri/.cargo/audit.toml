# cargo-audit policy. Ignores are DOCUMENTED EXCEPTIONS, not dismissals:
# every entry needs the reason and the unblock condition.
[advisories]
ignore = [
    # quick-xml <0.41 DoS-class issues (quadratic dup-attribute check /
    # unbounded namespace allocation). Pinned by plist -> tauri-utils; no
    # compatible fix until Tauri bumps plist. plist parsing happens in the
    # bundling toolchain, not on hostile input at runtime. Re-check on every
    # Tauri upgrade and drop these when `cargo update quick-xml` moves.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zip 4.6.1, pinned by tauri-plugin-updater 2.10 (our own `zip` and
    # candle-core 0.11.1 are on 9). The updater opens exactly one archive
    # with `ZipArchive::new`: the update it downloaded, after verifying our
    # minisign signature — an archive we built and signed.
    #  - 0367/0368/0369/0429: `extract()` keeps SUID/SGID bits, follows
    #    symlinks, or aborts on a symlink entry with a huge declared size.
    #  - 0545: AES entries returned without checking their authentication
    #    code. Our update archives are not encrypted.
    #  - 0548: `ZipStreamReader` trusts local-header names. The updater does
    #    not use the streaming reader.
    # Drop all of these with the move to tauri-plugin-updater >= 2.14 (zip 9),
    # which needs tauri >= 2.12: a Tauri upgrade with its own GUI check.
    # Carlos OK'd 0367-0429 on 2026-11-04; 0545 and 0548 added 2026-11-18.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
]
