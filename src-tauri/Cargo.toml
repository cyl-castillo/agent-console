[package]
name = "agent-console"
version = "0.93.1"
description = "Agent Console — minimalist AI-native console IDE"
authors = ["Carlos Castillo"]
license = "AGPL-3.0-only"
edition = "2021"
# Two binaries (the app and the `phone-sim` reference client): name the app.
default-run = "agent-console"

[lib]
name = "agent_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phone-sim"
path = "src/bin/phone_sim.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
# RFC 8785 canonical JSON for the IETF agent-audit-trail export (D3).
serde_jcs = "0.2"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.2"
regex = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
walkdir = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-util", "net"] }
portable-pty = "0.8"
dirs = "5"
notify = "6"
notify-debouncer-mini = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
cpal = "0.18"
# F8 remote decisions: Noise E2E channel to a paired device. snow = the vetted
# Rust implementation of the Noise Protocol Framework — never our own crypto.
snow = "0.9"
rand = "0.8"
data-encoding = "2"
# QR rendering for the pairing offer (SVG only; image backend disabled).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# tracing_backend: whisper.cpp/ggml log lines go to tracing (debug level)
# instead of flooding stderr with per-token decode traces.
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
# Piper TTS is fetched as a release archive on first use (tar.gz / zip).
tar = "0.4"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `test` unlocks tauri::test::{mock_builder, MockRuntime} for the terminal
# lifecycle tests. Dev-only: release builds never enable it.
tauri = { version = "2", features = ["test"] }

[workspace]
members = ["hook-bridge"]
